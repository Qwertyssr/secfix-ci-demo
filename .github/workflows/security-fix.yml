# Simple demo CI: security scan -> secfix fix PR when needed.
# The demo uses committed Black Duck/Fortify-shaped reports because no scanner
# APIs are configured yet. Secfix owns fixes, validation, and PR creation.

name: security-fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # push the fix branch
  pull-requests: write     # open the PR

jobs:
  scan-and-fix:
    if: ${{ !startsWith(github.ref_name, 'secfix/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run security scan (demo reports)
        id: security-scan
        run: |
          test -f scan_reports/blackduck.json
          test -f scan_reports/fortify.json
          python - <<'PY'
          import json
          import os

          allowed = {"critical", "high"}

          with open("scan_reports/blackduck.json", encoding="utf-8") as fh:
              blackduck = json.load(fh)
          with open("scan_reports/fortify.json", encoding="utf-8") as fh:
              fortify = json.load(fh)

          count = 0
          for item in blackduck.get("items", []):
              vuln = item.get("vulnerabilityWithRemediation", {})
              if vuln.get("severity", "").lower() in allowed:
                  count += 1
          for issue in fortify.get("data", []):
              severity = issue.get("friority") or issue.get("severity") or ""
              if severity.lower() in allowed:
                  count += 1

          has_vulnerabilities = "true" if count else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_vulnerabilities={has_vulnerabilities}\n")
              fh.write(f"finding_count={count}\n")
          print(f"Security scan found {count} critical/high vulnerabilities.")
          PY

      - name: Fix vulnerabilities and open PR with secfix
        if: steps.security-scan.outputs.has_vulnerabilities == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m secfix \
            --root . \
            --blackduck scan_reports/blackduck.json \
            --fortify scan_reports/fortify.json \
            --req sample_app/requirements.txt \
            --severities critical,high \
            --test-cmd "python -m unittest discover -s sample_app/tests" \
            --base "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pr-body-out pr-body.md \
            --open-pr

      - name: Upload PR body artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secfix-pr-body
          path: pr-body.md
          if-no-files-found: ignore
