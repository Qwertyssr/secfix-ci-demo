# Simple demo CI: security scan -> secfix check -> secfix fix PR when needed.
# The demo uses committed Black Duck/Fortify-shaped reports because no scanner
# APIs are configured yet. Secfix owns the finding check, fixes, validation, and PR.

name: security-fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # push the fix branch
  pull-requests: write     # open the PR

jobs:
  scan-and-fix:
    if: ${{ !startsWith(github.ref_name, 'secfix/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run security scan (demo reports)
        run: |
          test -f scan_reports/blackduck.json
          test -f scan_reports/fortify.json
          echo "Demo Black Duck and Fortify reports are ready."

      - name: Check vulnerabilities with secfix
        id: secfix-check
        run: |
          python -m secfix \
            --check-only \
            --blackduck scan_reports/blackduck.json \
            --fortify scan_reports/fortify.json \
            --severities critical,high

      - name: Fix vulnerabilities and open PR with secfix
        if: steps.secfix-check.outputs.has_vulnerabilities == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m secfix \
            --root . \
            --blackduck scan_reports/blackduck.json \
            --fortify scan_reports/fortify.json \
            --req sample_app/requirements.txt \
            --severities critical,high \
            --test-cmd "python -m unittest discover -s sample_app/tests" \
            --base "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pr-body-out pr-body.md \
            --open-pr

      - name: Upload PR body artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secfix-pr-body
          path: pr-body.md
          if-no-files-found: ignore
