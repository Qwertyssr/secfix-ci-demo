# Reusable composite action.
# In another repo's workflow:
#
#   - uses: <owner>/secfix-ci-demo/.github/actions/secfix@main
#     with:
#       blackduck: scan_reports/blackduck.json
#       fortify:   scan_reports/fortify.json
#       req:       requirements.txt
#       test-cmd:  "python -m unittest discover -s tests"
#       open-pr:   "true"
#     env:
#       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: secfix
description: "Turn Black Duck (SCA) and Fortify (SAST) findings into a validated pull request."

inputs:
  blackduck:
    description: "Path to the Black Duck report JSON (omit to skip SCA)."
    required: false
    default: ""
  fortify:
    description: "Path to the Fortify report JSON (omit to skip SAST)."
    required: false
    default: ""
  req:
    description: "requirements file path (relative to root)."
    required: false
    default: "requirements.txt"
  severities:
    description: "Comma list of severities to auto-fix."
    required: false
    default: "critical,high"
  test-cmd:
    description: "Validation test command."
    required: false
    default: ""
  base:
    description: "Base branch for the PR."
    required: false
    default: ""
  open-pr:
    description: "Set 'true' to commit, push and open a PR."
    required: false
    default: "false"
  secfix-ref:
    description: "Git ref of the secfix agent to install."
    required: false
    default: "main"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install secfix
      shell: bash
      run: python -m pip install --quiet "git+https://github.com/${{ github.action_repository || 'OWNER/secfix-ci-demo' }}@${{ inputs.secfix-ref }}"

    - name: Run secfix
      shell: bash
      run: |
        args=(--root . --req "${{ inputs.req }}" --severities "${{ inputs.severities }}" --pr-body-out pr-body.md)
        [ -n "${{ inputs.blackduck }}" ] && args+=(--blackduck "${{ inputs.blackduck }}")
        [ -n "${{ inputs.fortify }}" ] && args+=(--fortify "${{ inputs.fortify }}")
        [ -n "${{ inputs.test-cmd }}" ] && args+=(--test-cmd "${{ inputs.test-cmd }}")
        [ -n "${{ inputs.base }}" ] && args+=(--base "${{ inputs.base }}")
        [ "${{ inputs.open-pr }}" = "true" ] && args+=(--repo "${{ github.repository }}" --open-pr)
        python -m secfix "${args[@]}"
